name: Deploy

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build:web
      - run: npm run lint --workspace=apps/web-client

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - service: api-server
            context: .
            dockerfile: ./apps/api-server/Dockerfile
          - service: web-client
            context: .
            dockerfile: ./apps/web-client/Dockerfile
          - service: media-worker
            context: ./apps/media-worker
            dockerfile: ./apps/media-worker/Dockerfile

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.SERVER_HOST }}:4000/api/v1
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Docker Compose config to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/vod-app"
          overwrite: true

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/vod-app
            # Create a blank .env if it does not exist (user will configure it)
            touch .env
            
            # Login to DockerHub on remote (optional but helpful to pull private images if any)
            # echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Export Docker Username for docker-compose file template evaluation
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env.docker
            
            # Merge .env.docker with user-managed .env
            cat .env.docker .env > .env.temp && mv .env.temp .env && rm -f .env.docker

            docker compose pull
            docker compose up -d --remove-orphans

